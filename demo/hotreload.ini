[watch]
; O exe abre sozinho o console do "hrctl watch" ao iniciar (0 desliga).
; Caminhos relativos valem a partir da pasta do exe (demo\bin). Agentes: HOTRELOAD_NOWATCH=1.
auto=1
hrctl=..\..\tools\hrctl\bin\hrctl.exe
dir=..
patch_build=..\..\build\patch-demo.bat
new=patch\HotDemo.exe
build=..\..\build\make-demo.bat
auto_restart=0
